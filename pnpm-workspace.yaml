packages:
  - "backend/*"
  - "frontend"

# Every workspace package lints and formats with the same Biome release. Bump it
# here and each package picks it up via "@biomejs/biome": "catalog:".
catalog:
  "@biomejs/biome": 2.5.6

allowBuilds:
  "@apollo/protobufjs": true
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@swc/core": true
  bcrypt: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# @untitled-ui/icons-react imports @babel/runtime/helpers/esm/extends but fails
# to declare @babel/runtime as a dependency (upstream bug). Declaring it here
# makes pnpm link @babel/runtime inside the package's own virtual store so the
# import resolves deterministically on any layout (including Vercel's fresh
# frozen-lockfile install), regardless of hoisting.
packageExtensions:
  "@untitled-ui/icons-react@*":
    dependencies:
      "@babel/runtime": "^7.29.7"
  # @fastify/multipart types import from 'fastify' but do not declare it as a
  # dependency or peer. Under pnpm, TypeScript then walks up to whatever
  # `fastify` sits in the workspace root, which can be a different copy than
  # @nestjs/platform-fastify's (distinct FastifyInstance types, and `req.file()`
  # never appears on the request). Linking fastify into the plugin's virtual
  # store keeps both on the same identity.
  "@fastify/multipart@*":
    dependencies:
      fastify: "5.10.0"

# Security overrides, all sourced from `pnpm audit`. Keys are version-scoped
# where two majors coexist in the tree: minimatch@3 needs the 1.x line while
# minimatch@10 needs 5.x, and an unscoped "brace-expansion" key would collapse
# both onto 1.x, whose CJS export has no named `expand` for minimatch@10.
overrides:
  "nanoid@^3": "3.3.18"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@5": "^5.0.9"
  "find-my-way": "^9.6.1"
  "form-data": "^4.0.6"
  "js-yaml@4": "^4.3.1"
  "js-yaml@5": "^5.2.2"
  "lodash": "^4.18.0"
  "shell-quote": "^1.8.5"

minimumReleaseAgeExclude:
  - '@code-x/lago'
