name: Pull Request Status Checks

on:
  pull_request:
    branches: [main, development]

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Setup Cache
        uses: actions/cache@v5
        id: restore-build
        with:
          path: ./*
          key: cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set cache key
        id: cache-key
        run: echo "value=cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

  lint-and-test-frontend:
    name: Lint and Test - Frontend
    needs: setup
    uses: ./.github/workflows/frontend-checks.yml
    with:
      cached-build-id: ${{ needs.setup.outputs.cache-key }}

  lint-and-test-backend:
    name: Lint and Test - Backend
    needs: setup
    uses: ./.github/workflows/backend-checks.yml
    with:
      cached-build-id: ${{ needs.setup.outputs.cache-key }}

  e2e-tests:
    name: E2E Tests
    needs: setup
    uses: ./.github/workflows/e2e-checks.yml
    with:
      cached-build-id: ${{ needs.setup.outputs.cache-key }}
