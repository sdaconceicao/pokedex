name: Database Migrations

on:
  push:
    branches: [main]
    paths:
      - "backend/pokedex-rest/src/migrations/**"
      - "backend/pokedex-rest/src/run-migrations.ts"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Never run two migration jobs at once; queue instead of cancelling so
# every pushed migration still gets applied, in order.
concurrency:
  group: pokedex-rest-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Migrations - Backend REST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter ./backend/pokedex-rest run migration:run
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
